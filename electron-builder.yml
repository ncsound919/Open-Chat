appId: com.upliftlab.open-chat
productName: Open Chat
directories:
  buildResources: public
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
win:
  target: nsis
  icon: public/favicon.ico
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  installerIcon: public/favicon.ico
mac:
  target: dmg
  icon: public/favicon.ico
linux:
  target: AppImage
