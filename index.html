<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Private chat app for autonomous agents" />
    <!-- iOS status bar styling -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Android theme color -->
    <meta name="theme-color" content="#0d0d14" />
    <!-- Security headers via meta tags (primary enforcement is via server headers) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Open-Chat</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Ensure window.Capacitor is a writable, re-assignable object before
      // @capacitor/core evaluates (its initCapacitorGlobal does
      // `win.Capacitor = createCapacitor(win)`). If the native bridge or any
      // other script already pinned it read-only, redefine it as writable so
      // the app bundle initializes instead of throwing
      // "Cannot assign to read only property 'Capacitor'" (blank screen).
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'Capacitor');
          if (desc && !desc.writable) {
            Object.defineProperty(window, 'Capacitor', {
              value: desc.value || {},
              writable: true,
              configurable: true,
            });
          } else if (!desc) {
            Object.defineProperty(window, 'Capacitor', {
              value: {},
              writable: true,
              configurable: true,
            });
          }
        } catch (e) {
          // Non-fatal: if we cannot redefine it, core may still work when the
          // bridge already provided a writable Capacitor.
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
